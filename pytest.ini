[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --cov --cov-branch --cov-report=term-missing --cov-fail-under=85
markers =
    serial: needs a real serial port; deselect with -m "not serial"
    gui: needs GTK4/libadwaita and a display; skipped when unavailable
    slow: takes more than a second
